info:
  name: Create Monitor
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/monitors
  body:
    type: json
    data: |-
      {
        "brand": "Apple",
        "modelNumber": "Pro Display XDR",
        "screenSize": 32.0,
        "resolutionWidth": 6016,
        "resolutionHeight": 3384,
        "refreshRate": 60,
        "panelType": "IPS LCD",
        "aspectRatio": "16:9"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
